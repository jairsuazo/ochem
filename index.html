<html lang="en"><head><meta charset="utf-8">

<title>O-Chem Pulse</title>
<style>
:root{--bg:#fff3fa;--card:#fff;--ink:#3a2850;--mut:#85739a;--pink:#ff6fb0;--pd:#d4488a;--mint:#4fd1ae;--sun:#ffc54d;--lav:#9a8cff;--line:#f0dcf0;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#1c1430;--card:#2a1f44;--ink:#f7ebff;--mut:#b9a8d4;--line:#3e2f5e;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 ui-rounded,"SF Pro Rounded",Nunito,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:720px;margin:auto;padding:14px}
header{display:flex;align-items:center;gap:14px}
.beaker{width:64px;flex:none;animation:wig 3s ease-in-out infinite;transform-origin:50% 90%}
@keyframes wig{50%{transform:rotate(-4deg)}}
.hd{flex:1;min-width:0}
.say{background:var(--card);border:2px solid var(--line);border-radius:18px 18px 18px 4px;padding:8px 12px;font-weight:600}
.stats{display:flex;gap:12px;margin-top:6px;font-size:14px;color:var(--mut);flex-wrap:wrap}
.stats b{color:var(--ink)}
.gear{border:0;background:none;font-size:22px;cursor:pointer}
.card{background:var(--card);border:2px solid var(--line);box-shadow:0 6px 0 var(--line);border-radius:26px;padding:20px;margin-top:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--lav);border-color:var(--lav);color:#fff}
.dots{display:flex;gap:8px;margin-bottom:14px}
.dots i{height:10px;flex:1;border-radius:9px;background:var(--line)}
.dots i.on{background:var(--mint)}.dots i.cur{background:var(--pink)}
h2{margin:0 0 12px;font-size:22px;line-height:1.3}
.btn{border:0;border-radius:16px;padding:13px 20px;font:inherit;font-weight:700;background:var(--pink);color:#fff;box-shadow:0 4px 0 var(--pd);cursor:pointer;margin-top:14px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pd)}
.btn.alt{background:var(--lav);box-shadow:0 4px 0 #6f60d8}
.btn:disabled{opacity:.45}
.opt{display:block;width:100%;text-align:left;margin-top:10px;padding:13px 16px;border-radius:16px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;cursor:pointer}
.opt.ok{background:rgba(79,209,174,.25);border-color:var(--mint)}
.opt.no{background:rgba(255,197,77,.25);border-color:var(--sun)}
.note{margin-top:14px;padding:12px 14px;border-radius:16px;background:var(--bg);border-left:6px solid var(--lav)}
textarea,input[type=text],input[type=password]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:16px;padding:12px}
textarea:focus,input:focus,button:focus-visible{outline:3px solid var(--lav);outline-offset:2px}
.pad{display:block;width:100%;height:300px;background:#fff;border:2px dashed var(--lav);border-radius:18px;touch-action:none}
.tools{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 2px var(--line);cursor:pointer}
.sw.on{box-shadow:0 0 0 3px var(--ink)}
.ck{display:flex;gap:10px;align-items:flex-start;margin-top:8px}
.ck input{width:22px;height:22px;accent-color:var(--mint);flex:none}
.big{font-size:44px;font-weight:800;text-align:center;margin:4px 0}
.bar{height:12px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:6px}
.bar b{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--sun),var(--mint));transition:width .7s}
.cf{position:fixed;top:-30px;font-size:26px;pointer-events:none;animation:fall 1.9s ease-in forwards;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(400deg);opacity:.5}}
dialog{border:2px solid var(--line);border-radius:24px;background:var(--card);color:var(--ink);max-width:460px;width:92%}
dialog label{display:block;margin-top:12px;font-weight:700;font-size:15px}
small{color:var(--mut)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

const $=s=>document.querySelector(s),esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

{m:"Resonance",q:"Drawing resonance for the allyl cation, where does the curved-arrow tail start?",o:["On the + charge","On the adjacent π bond","On the carbon’s nucleus","On the empty p orbital"],a:1,e:"Arrows start where electrons are: π bonds or lone pairs. A + charge is an absence of electrons.",w:"Why can an arrow never start on a + charge?",k:"An arrow tracks a pair of electrons. A + marks an empty orbital, so there is nothing to push. Arrows start at bonds or lone pairs and end at electron-poor atoms.",d:"Draw both resonance forms of [CH2=CH–CH2]+ and the one arrow connecting them.",r:"Tail on the π bond, head on the C–C single bond."},
{m:"Stereochem",q:"Which chair of trans-1-chloro-4-methylcyclohexane is most stable?",o:["Both axial","Both equatorial","Cl equatorial, CH3 axial","Cl axial, CH3 equatorial"],a:1,e:"A trans-1,4 pair can be both equatorial (or both axial). Diequatorial avoids 1,3-diaxial strain.",w:"Where does 1,3-diaxial strain come from?",k:"An axial group on C1 sits close to the axial H’s on C3 and C5 on the same face, so van der Waals repulsion raises the energy. Equatorial groups point away from the ring.",d:"Draw (2R,3R)-tartaric acid in wedge-and-dash form.",r:"At C2 the CIP priorities are OH > COOH > CH(OH)COOH > H, with H on a dash when it points back."},
{m:"SN2 / E2",q:"Which halide can never do SN2?",o:["1-bromobutane","2-bromobutane","2-bromo-2-methylpropane","Bromomethane"],a:2,e:"A tertiary carbon blocks backside attack on the C–Br σ* orbital.",w:"Why does SN2 need a backside attack, and what does that do to stereochemistry?",k:"The nucleophile donates into the C–LG σ* orbital, whose big lobe is 180° from the leaving group. That forces inversion, like an umbrella flipping in the wind.",d:"Draw HO⁻ attacking bromomethane, with the transition state.",r:"One arrow from the O lone pair to C, one from the C–Br bond to Br."},
{m:"SN2 / E2",q:"(2R)-2-bromobutane + NaCN in DMSO. Major product?",o:["Racemic 2-methylbutanenitrile","(2S)-2-methylbutanenitrile","(2R)-2-methylbutanenitrile","2-butene"],a:1,e:"CN⁻ is a strong, unhindered nucleophile and a weak base, and DMSO speeds up SN2. Inversion turns 2R into 2S.",w:"How do the products differ for NaOMe/MeOH versus t-BuOK/t-BuOH on the same bromide?",k:"NaOMe gives mostly the Zaitsev alkene, 2-butene, plus some SN2 ether. Bulky t-BuOK can’t reach the internal H, so it takes the terminal H and gives the Hofmann alkene, 1-butene.",d:"Draw the SN2 step and show the stereocenter flipping with wedges and dashes.",r:"Nucleophile enters opposite the leaving group; the other three groups flip."},

{c:3,m:"Acids/bases",q:"Why is acetic acid (pKa ≈ 4.8) far more acidic than ethanol (pKa ≈ 16)?",o:["Resonance spreads the carboxylate charge over two oxygens","Ethanol’s O–H bond is stronger","Acetic acid is a bigger molecule","Ethoxide is the more stable base"],a:0,e:"Compare conjugate bases. Acetate delocalizes its negative charge; ethoxide keeps it on one oxygen.",w:"Why is HI a stronger acid than HF even though F is more electronegative?",k:"Atom size wins down a column. Iodide spreads its charge over a much larger volume, so I⁻ is the more stable base. Across a row, electronegativity wins instead.",d:"Draw both resonance forms of acetate with the curved arrow.",r:"Arrow from the O⁻ lone pair into a new C=O; the old C=O π bond moves onto the other O."},
{c:5,m:"Stereochem",q:"(2R,3S)-2,3-dibromobutane is related to its mirror image how?",o:["Identical: it is meso","Enantiomers","Diastereomers","Constitutional isomers"],a:0,e:"An internal mirror plane through the C2–C3 bond makes it achiral despite two stereocenters.",w:"How can a molecule have stereocenters and still be achiral?",k:"An internal mirror plane makes one half the reflection of the other, so the two centers cancel and the compound does not rotate light.",d:"Draw meso-2,3-dibromobutane as a Fischer projection and mark the mirror plane.",r:"Both Br on the same side; mirror line between C2 and C3."},

{c:12,m:"Alcohols",q:"Which reagent oxidizes a primary alcohol to an aldehyde and stops?",o:["PCC in CH2Cl2","H2CrO4 (Jones)","KMnO4, heat","NaBH4"],a:0,e:"With no water present there is no aldehyde hydrate to oxidize further. Jones conditions go on to the acid.",w:"Why can’t –OH be displaced directly, and what do SOCl2 and PBr3 change?",k:"OH⁻ is a poor leaving group. SOCl2 or PBr3 convert it into a good one, then halide attacks by SN2 with inversion at a stereocenter.",d:"Draw SOCl2/pyridine converting a secondary alcohol to the alkyl chloride.",r:"O attacks S and Cl⁻ leaves; pyridine removes H⁺; Cl⁻ then attacks from the back as SO2 leaves."},

 d.innerHTML=`<form method="dialog"><h2>Grade math</h2><small>Final replaces your lowest exam % if it’s higher. 90% = 450 of 500 pts.</small>`+f.map(([k,l])=>`<label>${l}<input type="text" inputmode="decimal" data-k="${k}" value="${esc(g[k]??"")}"></label>`).join("")+`<div class="note" id="gout"></div><button class="btn">Close</button></form>`;
 const v=k=>+g[k]||0,tot=x=>{const m=[v("e1"),v("e2"),v("e3")],lo=Math.min(...m);if(x>lo)m[m.indexOf(lo)]=x;return v("hw")+v("qz")+m.reduce((a,b)=>a+b,0)+x},
 calc=()=>{let n=null;for(let x=0;x<=100;x+=.5)if(tot(x)>=450){n=x;break}$("#gout").textContent=n==null?`Best case with a 100 on the final: ${(tot(100)/5).toFixed(1)}%. 90% is out of reach on these numbers, so aim for the best letter you can.`:`You’d need about ${n}% on the final for 90%.`};
 d.querySelectorAll("input").forEach(i=>i.oninput=()=>{S.gr[i.dataset.k]=i.value;save();calc()});calc();d.showModal()}
function render(){const q=Q[R.i],m=$("#main");
 const dots=[0,1,2].map(n=>`<i class="${n<R.s?"on":n==R.s?"cur":""}"></i>`).join("");
 if(R.s==0){m.innerHTML=`<div class="dots">${dots}</div><small>${esc(q.m)} · 3 quick steps</small><h2>${esc(q.q)}</h2>`+q.o.map((o,n)=>`<button class="opt" data-n="${n}">${esc(o)}</button>`).join("")+`<div id="fb"></div>`;
  m.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(R.p!=null)return;R.p=+b.dataset.n;const ok=R.p==q.a;m.querySelectorAll(".opt").forEach((x,n)=>{if(n==q.a)x.classList.add("ok");else if(n==R.p)x.classList.add("no")});say(ok?pick(PRAISE):pick(OOPS));if(ok)boom(10);$("#fb").innerHTML=`<div class="note">${esc(q.e)}</div><button class="btn" id="go">Next step</button>`;$("#go").onclick=()=>{R.s=1;render()}})}
 else if(R.s==1){m.innerHTML=`<div class="dots">${dots}</div><h2>${esc(q.w)}</h2><textarea id="why" rows="4" placeholder="Rough thoughts count. Two sentences is plenty."></textarea><button class="btn alt" id="rv">Show me the pro answer</button><div id="ans"></div>`;
  $("#rv").onclick=()=>{$("#rv").remove();$("#ans").innerHTML=`<div class="note"><b>Pro answer:</b> ${esc(q.k)}</div><p>How close was yours?</p><div class="chips"><button class="chip" data-r="0">Not close</button><button class="chip" data-r="60">Partly</button><button class="chip" data-r="100">Basically that</button></div><button class="btn" id="go" disabled>Next step</button>`;
   $("#ans").querySelectorAll("[data-r]").forEach(c=>c.onclick=()=>{R.wr=+c.dataset.r;$("#ans").querySelectorAll("[data-r]").forEach(x=>x.classList.remove("on"));c.classList.add("on");$("#go").disabled=false});
   $("#go").onclick=()=>{R.why=$("#why").value;R.s=2;render()}}}
 else if(R.s==2){m.innerHTML=`<div class="dots">${dots}</div><h2>${esc(q.d)}</h2><canvas class="pad" id="pad"></canvas><div class="tools"><span class="sw on" data-c="#5b3fd1" style="background:#5b3fd1"></span><span class="sw" data-c="#d4488a" style="background:#d4488a"></span><span class="sw" data-c="#0e9f84" style="background:#0e9f84"></span><button class="chip" id="er">Eraser</button><button class="chip" id="un">Undo</button><button class="chip" id="cl">Clear</button><label class="chip">📷 Photo<input type="file" id="ph" accept="image/*" hidden></label></div>
  <p><b>Self-check</b> (tick what’s true)</p><label class="ck"><input type="checkbox" class="rb"><span>${esc(q.r)}</span></label><label class="ck"><input type="checkbox" class="rb"><span>Every arrow starts on a lone pair or a bond, never on a + or an atom label.</span></label><label class="ck"><input type="checkbox" class="rb"><span>Charges and wedges/dashes are shown where they matter.</span></label><button class="btn" id="fin">Finish quest</button>`;pad()}
 else{res()}}
function pad(){const c=$("#pad"),x=c.getContext("2d"),d=devicePixelRatio||1;c.width=c.clientWidth*d;c.height=300*d;x.scale(d,d);x.lineCap=x.lineJoin="round";let on=false,er=false;
 const pos=e=>{const r=c.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
 const snap=()=>{if(snaps.length>12)snaps.shift();snaps.push(c.toDataURL())};
 const put=u=>{const i=new Image();i.onload=()=>{x.save();x.setTransform(1,0,0,1,0,0);x.globalCompositeOperation="source-over";x.clearRect(0,0,c.width,c.height);x.drawImage(i,0,0);x.restore()};i.src=u};
 c.onpointerdown=e=>{if(e.pointerType=="pen")penSeen=true;if(e.pointerType=="touch"&&penSeen)return;e.preventDefault();c.setPointerCapture(e.pointerId);on=true;ink=true;snap();const[a,b]=pos(e);x.beginPath();x.moveTo(a,b);x.globalCompositeOperation=er?"destination-out":"source-over";x.strokeStyle=pen;x.lineWidth=er?24:3}
 c.onpointermove=e=>{if(!on)return;(e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(p=>{const[a,b]=pos(p);x.lineTo(a,b);x.stroke()})};
 c.onpointerup=c.onpointercancel=()=>{on=false};
 document.querySelectorAll(".sw").forEach(s=>s.onclick=()=>{er=false;pen=s.dataset.c;document.querySelectorAll(".sw").forEach(z=>z.classList.remove("on"));s.classList.add("on")});
 $("#er").onclick=()=>{er=!er};$("#un").onclick=()=>{if(snaps.length)put(snaps.pop())};$("#cl").onclick=()=>{snap();x.save();x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,c.width,c.height);x.restore();ink=false};
 $("#ph").onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const i=new Image();i.onload=()=>{snap();const w=c.clientWidth,s=Math.min(w/i.width,300/i.height,1);x.globalCompositeOperation="source-over";x.drawImage(i,(w-i.width*s)/2,(300-i.height*s)/2,i.width*s,i.height*s);ink=true};i.src=rd.result};rd.readAsDataURL(f)};
 $("#fin").onclick=fin}
async function ai(q,why,img){const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent",{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":S.key},body:JSON.stringify({systemInstruction:{parts:[{text:"You are a kind organic chemistry TA. Check curved arrows (tails on lone pairs or bonds, heads on atoms), formal charges and stereochemistry in the image. Be specific and encouraging, under 60 words. Reply JSON only: {\"drawScore\":0-100,\"note\":\"...\"}"}]},contents:[{role:"user",parts:[{text:`Task: ${q.d}\nRule: ${q.r}\nWritten answer: ${why||"(none)"}`},{inlineData:{mimeType:"image/jpeg",data:img.split(",")[1]}}]}],generationConfig:{responseMimeType:"application/json"}})});
 if(!r.ok)throw 0;const j=JSON.parse((await r.json()).candidates[0].content.parts[0].text),s=Math.round(+j.drawScore);return{score:isFinite(s)?Math.max(0,Math.min(100,s)):null,note:String(j.note||"")}}
async function fin(){const q=Q[R.i],c=$("#pad");const b=$("#fin");const checks=[...document.querySelectorAll(".rb")];let ds=Math.round(checks.filter(k=>k.checked).length/checks.length*100);
 if(!ink&&!checks.some(k=>k.checked)){say("Sketch something, even a messy first try!");return}
 b.disabled=true;b.textContent="Beaker is looking…";R.ai=null;
 if(S.key&&ink){try{const t=document.createElement("canvas");t.width=c.width;t.height=c.height;const g=t.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,t.width,t.height);g.drawImage(c,0,0);R.img=t.toDataURL("image/jpeg",.85);const a=await ai(q,R.why,R.img);R.ai=a.note;if(a.score!=null)ds=a.score}catch(e){R.ai="Beaker couldn’t reach the AI coach, so this score is from your self-check."}}
 const mc=R.p==q.a?100:0,sc=Math.round(mc*.2+R.wr*.3+ds*.5),xp=20+Math.round(sc/4);
 const old=S.mast[q.m]??sc;S.mast[q.m]=Math.round(old*.6+sc*.4);S.xp+=xp;R.sc=sc;R.xp=xp;R.parts=[mc,R.wr,ds];R.gem=Math.random()<.4;
 if(R.gem){S.gems++;const f=STK.filter(s=>!S.stk.includes(s));if(f.length){R.sticker=pick(f);S.stk.push(R.sticker)}else R.sticker=null}else R.sticker=null;
 const t=new Date().toDateString();if(S.last!=t){const gap=S.last?Math.round((new Date(t)-new Date(S.last))/864e5):0;if(!S.last)S.streak=1;else if(gap==1)S.streak++;else if(gap==2&&S.shield>0){S.shield--;S.streak++;R.shield=true}else{S.streak=1;R.fresh=true}S.last=t}
 const bx=sc>=70?Math.min(4,(S.box[R.i]||0)+1):0;S.box[R.i]=bx;S.due[R.i]=Date.now()+[0,1,3,7,14][bx]*DAY;const dt=new Date().toDateString();S.tg=S.tg.d==dt?{d:dt,n:S.tg.n+1}:{d:dt,n:1};R.seen.push(R.i);save();todayCard();
 if(S.share&&/^https:\/\//.test(S.hook))fetch(S.hook,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({content:`🎉 ${S.name} finished a ${q.m} quest: ${sc}%`,allowed_mentions:{parse:[]}})}).catch(()=>{});
 R.s=3;render();boom(26)}
function res(){const q=Q[R.i],m=$("#main"),n=R.parts;hud();
 say(R.sc>=85?"Mastered! Beaker is overflowing!":R.sc>=60?"Solid work. You’re closer than you think.":"Finished counts. Every attempt fills the beaker.");
 m.innerHTML=`<div class="dots"><i class="on"></i><i class="on"></i><i class="on"></i></div><div class="big">+${R.xp} XP</div><p style="text-align:center;margin:0">Quest score ${R.sc}% · ${esc(q.m)} mastery ${S.mast[q.m]}%</p><div class="bar"><b style="width:${S.mast[q.m]}%"></b></div>
 ${R.gem?`<div class="note">💎 Bonus gem!${R.sticker?` New sticker: ${R.sticker}`:""}</div>`:""}
 ${R.shield?`<div class="note">A streak shield covered your missed day. Streak saved.</div>`:""}${R.fresh?`<div class="note">Fresh start today. Day 1 is still a win.</div>`:""}
 ${S.tg.n==3?`<div class="note">Daily goal hit! Anything more is bonus.</div>`:""}
 ${R.ai?`<div class="note"><b>Beaker’s note on your drawing:</b> ${esc(R.ai)}</div>`:""}
 <div class="note">Steps: choice ${n[0]}% · why ${n[1]}% · drawing ${n[2]}%. ${S.key?"":"Drawing score is your self-check."}</div>
 <button class="btn" id="nx">Another quest</button> <button class="btn alt" id="br">2-minute break</button>`;R.shield=R.fresh=false;
 $("#nx").onclick=next;$("#br").onclick=()=>{say("Stretch, water, wiggle. I’ll hold your spot.");m.innerHTML=`<div class="big">☕</div><p style="text-align:center">Back whenever you’re ready.</p><button class="btn" id="nx2">I’m back</button>`;$("#nx2").onclick=next}}
function boom(n){if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;for(let i=0;i<n;i++){const s=document.createElement("span");s.className="cf";s.textContent=pick(["✨","🧪","💖","🫧","⭐"]);s.style.left=Math.random()*100+"vw";s.style.animationDelay=Math.random()*.5+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),2600)}}
$("#gear").onclick=()=>{$("#nm").value=S.name;$("#ky").value=S.key;$("#hk").value=S.hook;$("#sh").checked=S.share;$("#dlg").showModal()};
$("#sv").onclick=()=>{S.name=$("#nm").value.trim()||"Avion";S.key=$("#ky").value.trim();S.hook=$("#hk").value.trim();S.share=$("#sh").checked;save()};
chips();hud();todayCard();next();
</script></body></html>
